name: Build and publish backend image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - ai_backend_server.py
      - indictrans_processor.py
      - requirements.txt
      - .github/workflows/docker-publish.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/epunjabi-backend:latest
            ghcr.io/${{ github.repository_owner }}/epunjabi-backend:sha-${{ github.sha }}
