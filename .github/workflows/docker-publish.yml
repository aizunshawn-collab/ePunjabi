name: Build and publish backend image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - ai_backend_server.py
      - indictrans_processor.py
      - requirements.txt
      - .github/workflows/docker-publish.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image now bakes in ~8-10GB of model weights (see Dockerfile) so
      # cold-start workers don't download them at runtime. The default
      # runner's ~14GB free disk isn't enough headroom for that plus the
      # CUDA base image + pip installs, so remove large preinstalled
      # toolchains this job doesn't use to free up space first.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -a -f

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # IndicTrans2's 2 HF repos are gated - the Dockerfile's model-
          # prefetch steps need this to authenticate (repo secret, not a
          # build ARG, so it never lands in an image layer/history).
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/epunjabi-backend:latest
            ghcr.io/${{ github.repository_owner }}/epunjabi-backend:sha-${{ github.sha }}
