# fly.toml app configuration file generated for epunjabi-backend on 2026-09-21T21:04:03-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'epunjabi-backend'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '5m0s'
    path = '/health'

[[vm]]
  size = 'performance-4x'
  memory = '8gb'
